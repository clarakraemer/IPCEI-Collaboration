[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ipcei-spillovers"
version = "0.1.0"
dependencies = [
  "pandas>=2.0",
  "mysql-connector-python>=8.0",
  "pyarrow>=14.0",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
